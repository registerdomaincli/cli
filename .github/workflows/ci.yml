# CLI CI: build, vet, test (the plan's step-12 ci.yml for the public repo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...

  plugin:
    # plugin/ is the Claude directory plugin bundle. Everything a plugin
    # loads must live inside its folder (no symlinks), so the skill is a
    # copy of skills/domain-cli/SKILL.md — this keeps the two identical.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmp skills/domain-cli/SKILL.md plugin/skills/domain-cli/SKILL.md || {
            echo "::error::plugin/skills/domain-cli/SKILL.md differs from skills/domain-cli/SKILL.md; run: cp skills/domain-cli/SKILL.md plugin/skills/domain-cli/SKILL.md"
            exit 1
          }
          cmp LICENSE plugin/LICENSE
