# CLI CI: build, vet, test (the plan's step-12 ci.yml for the public repo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...

  plugin:
    # plugin/ is the Claude directory plugin bundle. Everything a plugin
    # loads must live inside its folder (no symlinks), so its skill and
    # LICENSE are generated from the canonical files by tools/pluginbundle —
    # this fails when they are stale or plugin/skills holds anything else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: |
          go run ./tools/pluginbundle -check || {
            echo "::error::plugin/ is stale (skill or LICENSE, or an unexpected file under plugin/skills); run: go run ./tools/pluginbundle"
            exit 1
          }
