# CLI CI: build, vet, test (the plan's step-12 ci.yml for the public repo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...
